<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 749" width="720" height="749" role="img" aria-labelledby="witness-chain-title witness-chain-desc" style="display:block;width:100%;height:auto;min-width:620px;font-family:system-ui,-apple-system,sans-serif"><title id="witness-chain-title">Asynchronous memory witness pipeline</title><desc id="witness-chain-desc">The memory mutation and immutable outbox intent commit in one transaction. A separately credentialed worker later appends the hash-chain row, witness and delivery acknowledgement in a second transaction. Failure of that drain rolls it back for retry. Off-host retention depends on a configured consumer. Bus capture is separate.</desc><defs><marker id="witness-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647985"/></marker></defs><rect width="720" height="749" rx="12" fill="#f7fafc"/><text x="28" y="36" font-size="16" fill="#175b85" font-weight="700" text-anchor="start">MEMORY EVIDENCE · TWO TRANSACTIONS</text><rect x="28" y="65" width="664" height="113" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="94" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">1. Mutation transaction</text><text x="44" y="122" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Change memory + insert immutable outbox intent</text><text x="44" y="147" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Intent submission failure aborts the mutation.</text><path d="M 360 178 L 360 233" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#witness-chain-arrow)"/><text x="380" y="211" font-size="17" fill="#526775" font-weight="400" text-anchor="start">commit</text><rect x="28" y="233" width="664" height="90" rx="9" fill="#fff3df" stroke="#cfa269"/><text x="44" y="262" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Committed intent waits for the worker</text><text x="44" y="290" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Memory is committed; the completed witness may lag.</text><path d="M 360 323 L 360 379" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#witness-chain-arrow)"/><text x="380" y="354" font-size="17" fill="#526775" font-weight="400" text-anchor="start">bounded drain</text><rect x="28" y="379" width="664" height="139" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="408" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">2. Worker transaction · separate credential</text><text x="44" y="436" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Append chain row + witness + delivery acknowledgement</text><text x="44" y="461" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Commit all together.</text><text x="44" y="486" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Failure rolls back the drain; the intent remains pending.</text><path d="M 360 518 L 360 571" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#witness-chain-arrow)" stroke-dasharray="6 5"/><text x="380" y="549" font-size="17" fill="#526775" font-weight="400" text-anchor="start">export + retain</text><rect x="28" y="571" width="664" height="89" rx="9" fill="#ffffff" stroke="#b4c3cc"/><text x="44" y="600" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Off-host evidence consumer</text><text x="44" y="628" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Useful only for records and checkpoints it actually retains.</text><text x="28" y="696" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Dashed arrow: retention depends on operator configuration.</text><text x="28" y="723" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Bus capture is a separate record and does not seal this chain.</text></svg>
