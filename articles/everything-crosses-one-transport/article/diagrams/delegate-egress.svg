<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 759" width="720" height="759" role="img" aria-labelledby="delegate-egress-title delegate-egress-desc" style="display:block;width:100%;height:auto;min-width:620px;font-family:system-ui,-apple-system,sans-serif"><title id="delegate-egress-title">Delegate network boundary and package proxy</title><desc id="delegate-egress-desc">The container has no direct external network route. A mounted Unix control socket reaches mediated tools in aimee-server. Package requests use the Go proxy, which validates a destination before dialing. Post-start and resume checks inspect actual network, mounts and environment. The source worktree is also a mounted data surface.</desc><defs><marker id="delegate-egress-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647985"/></marker></defs><rect width="720" height="759" rx="12" fill="#f7fafc"/><text x="28" y="36" font-size="16" fill="#175b85" font-weight="700" text-anchor="start">DELEGATED EXECUTION · MEDIATED EGRESS</text><rect x="28" y="64" width="664" height="115" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="93" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Delegate container · network none</text><text x="44" y="121" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Assigned worktree: writable for editing, read-only for review</text><text x="44" y="146" font-size="17" fill="#526775" font-weight="400" text-anchor="start">No provider keys, forge credentials or Docker socket</text><path d="M 360 179 L 360 222" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#delegate-egress-arrow)"/><text x="380" y="207" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Unix control socket</text><rect x="28" y="222" width="664" height="89" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="251" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">aimee-server</text><text x="44" y="279" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Mediated tools: forge, web, memory, code index, providers</text><path d="M 360 311 L 360 359" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#delegate-egress-arrow)"/><text x="380" y="341" font-size="17" fill="#526775" font-weight="400" text-anchor="start">package proxy request</text><rect x="28" y="359" width="664" height="110" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="388" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Go-owned proxy</text><text x="44" y="416" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Check host + port → resolve → validate IP → dial that IP</text><text x="44" y="441" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Plain HTTP: filter headers. CONNECT: relay opaque bytes.</text><path d="M 360 469 L 360 515" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#delegate-egress-arrow)"/><rect x="28" y="515" width="664" height="62" rx="9" fill="#ffffff" stroke="#b4c3cc"/><text x="44" y="544" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Allowed package destination</text><rect x="28" y="608" width="664" height="89" rx="9" fill="#fff3df" stroke="#cfa269"/><text x="44" y="637" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Verify actual state before handover</text><text x="44" y="665" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Inspect network, mounts and environment on start or resume.</text><text x="28" y="733" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Failure or unknown state refuses the container.</text></svg>
