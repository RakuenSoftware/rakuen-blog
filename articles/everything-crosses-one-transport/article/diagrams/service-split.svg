<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 735" width="720" height="735" role="img" aria-labelledby="service-split-title service-split-desc" style="display:block;width:100%;height:auto;min-width:620px;font-family:system-ui,-apple-system,sans-serif"><title id="service-split-title">Server and knowledge-base service topology</title><desc id="service-split-desc">A user’s server initiates requests to a shared knowledge base, which replies. Each daemon has its own intra-daemon bus, grants and records. Authenticated network APIs connect the services. Configured exports may provide independent retained records. Either service can cause harm on its own; no automatic mutual-audit routine is established.</desc><defs><marker id="service-split-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647985"/></marker></defs><rect width="720" height="735" rx="12" fill="#f7fafc"/><text x="28" y="36" font-size="16" fill="#175b85" font-weight="700" text-anchor="start">SERVICE SPLIT · SEPARATE AUTHORITY AND RECORDS</text><rect x="28" y="66" width="294" height="210" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="95" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">aimee-server</text><text x="44" y="123" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Near one user’s work</text><text x="44" y="148" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Can invoke local tools</text><text x="44" y="173" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Own bus + grants</text><text x="44" y="198" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Own records</text><rect x="398" y="66" width="294" height="210" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="414" y="95" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">aimee-kb</text><text x="414" y="123" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Shared learned state</text><text x="414" y="148" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Memory + policy decisions</text><text x="414" y="173" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Own bus + grants</text><text x="414" y="198" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Evidence ledger + worker</text><path d="M 322 137 L 398 137" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#service-split-arrow)"/><text x="360" y="121" font-size="14" fill="#526775" font-weight="400" text-anchor="middle">request</text><path d="M 398 209 L 322 209" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#service-split-arrow)"/><text x="360" y="194" font-size="14" fill="#526775" font-weight="400" text-anchor="middle">reply</text><text x="28" y="472" font-size="17" fill="#526775" font-weight="400" text-anchor="start">The link between services is an authenticated network API.</text><text x="28" y="498" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Each service’s shared-memory bus stays inside its daemon.</text><path d="M 175 276 L 175 315 L 260 315 L 260 350" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#service-split-arrow)" stroke-dasharray="6 5"/><path d="M 545 276 L 545 315 L 460 315 L 460 350" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#service-split-arrow)" stroke-dasharray="6 5"/><rect x="28" y="350" width="664" height="89" rx="9" fill="#ffffff" stroke="#b4c3cc"/><text x="44" y="379" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Retained exports</text><text x="44" y="407" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Comparison is possible where independent copies survive.</text><rect x="28" y="533" width="664" height="113" rx="9" fill="#fff3df" stroke="#cfa269"/><text x="44" y="562" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Either side can cause harm</text><text x="44" y="590" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Server compromise: reachable work and credentials.</text><text x="44" y="615" font-size="17" fill="#526775" font-weight="400" text-anchor="start">KB compromise: false memory or policy in replies.</text><text x="28" y="682" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Dashed arrows depend on export and retention configuration.</text><text x="28" y="709" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Independent processes do not guarantee independent hosts.</text></svg>
