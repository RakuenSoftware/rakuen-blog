<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 616" width="720" height="616" role="img" aria-labelledby="bus-path-title bus-path-desc" style="display:block;width:100%;height:auto;min-width:620px;font-family:system-ui,-apple-system,sans-serif"><title id="bus-path-title">Per-daemon transport and observation</title><desc id="bus-path-desc">Module A writes its outbound ring. The C host assigns a sequence, offers the event to the tap, then routes by grant into Module B’s inbound ring. Capture branches from the tap and can fail or be pruned. Unix attach passes memory descriptors once. This is an intra-daemon data path.</desc><defs><marker id="bus-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647985"/></marker></defs><rect width="720" height="616" rx="12" fill="#f7fafc"/><text x="28" y="36" font-size="16" fill="#175b85" font-weight="700" text-anchor="start">ONE DAEMON · ONE ORDERED ROUTE</text><rect x="28" y="72" width="190" height="136" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="44" y="101" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Module A</text><text x="44" y="129" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Own process</text><text x="44" y="154" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Outbound ring</text><rect x="502" y="72" width="190" height="136" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="518" y="101" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Module B</text><text x="518" y="129" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Own process</text><text x="518" y="154" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Inbound ring</text><rect x="246" y="60" width="228" height="346" rx="12" fill="#ffffff" stroke="#8daec3" stroke-dasharray="6 4"/><text x="264" y="88" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">C host</text><rect x="264" y="106" width="192" height="60" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="280" y="135" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Sequence stamp</text><rect x="264" y="202" width="192" height="60" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="280" y="231" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Offer to tap</text><rect x="264" y="318" width="192" height="60" rx="9" fill="#eaf3f8" stroke="#8daec3"/><text x="280" y="347" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Route by grant</text><path d="M 218 136 L 264 136" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#bus-path-arrow)"/><path d="M 360 166 L 360 202" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#bus-path-arrow)"/><path d="M 360 262 L 360 318" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#bus-path-arrow)"/><path d="M 456 348 L 488 348 L 488 136 L 502 136" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#bus-path-arrow)"/><rect x="28" y="260" width="190" height="118" rx="9" fill="#fff3df" stroke="#cfa269"/><text x="44" y="289" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Capture sink</text><text x="44" y="317" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Frames + bodies</text><text x="44" y="342" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Can fail / prune</text><path d="M 264 232 L 238 232 L 238 285 L 218 285" fill="none" stroke="#647985" stroke-width="2" marker-end="url(#bus-path-arrow)"/><text x="360" y="293" font-size="16" fill="#526775" font-weight="400" text-anchor="middle">then</text><rect x="28" y="436" width="664" height="92" rx="9" fill="#ffffff" stroke="#b4c3cc"/><text x="44" y="465" font-size="19" fill="#172d3b" font-weight="600" text-anchor="start">Attach once over a Unix socket</text><text x="44" y="493" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Identity check → memory descriptors → mapped queues</text><text x="28" y="563" font-size="17" fill="#526775" font-weight="400" text-anchor="start">One direction shown. Replies use the reverse rings.</text><text x="28" y="590" font-size="17" fill="#526775" font-weight="400" text-anchor="start">Core-local calls and cross-machine APIs sit outside this route.</text></svg>
